services:
    backend:
        build:
            context: ./backend
        container_name: job-verify-backend

        ports:
            - "8000:8000"

        env_file:
            - ./backend/.env
        volumes:
            - ./backend:/app

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile.dev

        container_name: job-verify-frontend

        ports:
            - "5173:5173"

        depends_on:
            - backend

        volumes:
            - ./frontend:/app
            - /app/node_modules
